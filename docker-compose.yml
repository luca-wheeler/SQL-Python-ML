services:
  db:
    image: postgres:16
    container_name: credit-risk-db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # database survives restarts
      - ./data/raw:/data/raw:ro           # CSVs visible to Postgres, read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata: